name: ROTH IRA Daily Signal

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: "Compile and run tests without running the trading engine"
        required: false
        default: false
        type: boolean
      initialize_portfolio:
        description: "Explicitly initialize a missing state from ROTH_IRA_AMOUNT"
        required: false
        default: false
        type: boolean
      run_mode:
        description: "Operation to perform when validate_only is false"
        required: true
        default: signal
        type: choice
        options:
          - signal
          - confirm-execution
          - sync-holdings
      executed_signal_date:
        description: "Pending signal date (YYYY-MM-DD); required only for confirm-execution"
        required: false
        default: ""
        type: string
      executed_shares:
        description: "Complete holdings as space-separated TICKER=SHARES values, including CASH"
        required: false
        default: ""
        type: string

  schedule:
    # Run at 4:25 PM New York time, Monday through Friday.
    # The engine independently verifies exchange sessions and completed daily bars.
    - cron: "25 16 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: read
  actions: read

concurrency:
  group: roth-ira-production
  cancel-in-progress: false

jobs:
  roth-ira-signal:
    name: Generate ROTH IRA signal
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONUNBUFFERED: "1"
      TZ: "America/New_York"
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      REPOSITORY_ID: ${{ github.event.repository.id }}

    steps:
      - name: Guard stateful production ref
        if: >-
          ${{
            github.event_name == 'schedule' ||
            (github.event_name == 'workflow_dispatch' &&
             inputs.validate_only == false)
          }}
        env:
          DISPATCH_RUN_MODE: ${{ inputs.run_mode }}
          INITIALIZE_PORTFOLIO: ${{ inputs.initialize_portfolio }}
        shell: bash
        run: |
          set -euo pipefail
          expected_ref="refs/heads/${DEFAULT_BRANCH}"
          if [[ "${GITHUB_REF_TYPE}" != "branch" ||
                "${GITHUB_REF}" != "${expected_ref}" ]]; then
            echo "::error::Stateful portfolio operations must run from ${expected_ref}."
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" &&
                "${INITIALIZE_PORTFOLIO:-false}" == "true" &&
                "${DISPATCH_RUN_MODE}" != "signal" ]]; then
            echo "::error::initialize_portfolio is valid only with signal mode."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip

          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          else
            echo "::warning::requirements.txt was not found; installing runtime dependencies without pins."
            python -m pip install numpy pandas yfinance exchange-calendars
          fi

      - name: Verify Python, imports, and unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile port12_cloud.py
          python -m unittest discover -s tests -v

          python - <<'PY'
          import exchange_calendars
          import numpy
          import pandas
          import yfinance

          print("exchange_calendars:", exchange_calendars.__version__)
          print("numpy:", numpy.__version__)
          print("pandas:", pandas.__version__)
          print("yfinance:", yfinance.__version__)
          PY

      - name: Restore latest portfolio state
        id: restore_state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.validate_only == true) }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .state-restore
          mkdir -p .state-restore/unpacked
          trap 'rm -rf .state-restore' EXIT

          workflow_file="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_file="${workflow_file%%@*}"
          workflow_name="${workflow_file##*/}"
          workflow_run_pages="$(
            gh api \
              --method GET \
              --paginate \
              --slurp \
              --field branch="${DEFAULT_BRANCH}" \
              --field status=completed \
              --field per_page=100 \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_name}/runs"
          )"
          eligible_run_ids="$(
            jq -c '[.[].workflow_runs[].id]' <<< "${workflow_run_pages}"
          )"

          artifact_pages="$(
            gh api \
              --method GET \
              --paginate \
              --slurp \
              --field name=roth-ira-state \
              --field per_page=100 \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts"
          )"
          artifact_id="$(
            jq -r \
              --arg branch "${DEFAULT_BRANCH}" \
              --argjson repository_id "${REPOSITORY_ID}" \
              --argjson run_ids "${eligible_run_ids}" \
              '
                [
                  .[].artifacts[]
                  | select(.name == "roth-ira-state")
                  | select(.expired == false)
                  | select(.workflow_run.head_branch == $branch)
                  | select(.workflow_run.head_repository_id == $repository_id)
                  | .workflow_run.id as $run_id
                  | select($run_ids | index($run_id))
                ]
                | sort_by(.created_at, .id)
                | last
                | .id // empty
              ' <<< "${artifact_pages}"
          )"

          if [[ -z "${artifact_id}" ]]; then
            echo "restored=false" >> "${GITHUB_OUTPUT}"
            echo "No prior state artifact was found. This may be the first production run."
            exit 0
          fi

          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > .state-restore/state.zip
          unzip -q .state-restore/state.zip -d .state-restore/unpacked

          if [[ ! -f .state-restore/unpacked/roth_ira_state.json ]]; then
            echo "::error::State artifact ${artifact_id} is missing roth_ira_state.json."
            exit 1
          fi

          cp .state-restore/unpacked/roth_ira_state.json roth_ira_state.json
          echo "restored=true" >> "${GITHUB_OUTPUT}"
          echo "Restored roth_ira_state.json from artifact ${artifact_id}."

      - name: Check whether today is a US market session
        id: market_session
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        run: |
          set -euo pipefail

          is_session="$(
            python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo

          import exchange_calendars as xcals
          import pandas as pd

          today = pd.Timestamp(datetime.now(ZoneInfo("America/New_York")).date())
          calendar = xcals.get_calendar("XNYS")
          print("true" if calendar.is_session(today) else "false")
          PY
          )"

          echo "is_session=${is_session}" >> "${GITHUB_OUTPUT}"
          echo "US market session today: ${is_session}"

      - name: Skip scheduled holiday run
        if: ${{ github.event_name == 'schedule' && steps.market_session.outputs.is_session != 'true' }}
        run: echo "Today is not an XNYS trading session; no signal was generated."

      - name: Verify first-run account value
        if: >-
          ${{
            (github.event_name == 'schedule' &&
             steps.market_session.outputs.is_session == 'true') ||
            (github.event_name == 'workflow_dispatch' &&
             inputs.validate_only == false &&
             inputs.run_mode == 'signal')
          }}
        env:
          # May be blank after actual holdings have been persisted.
          # A fresh first run also requires initialize_portfolio=true.
          INITIALIZE_PORTFOLIO: ${{ inputs.initialize_portfolio }}
          ROTH_IRA_AMOUNT: >-
            ${{
              (github.event_name == 'workflow_dispatch' &&
               inputs.initialize_portfolio == true &&
               inputs.run_mode == 'signal') &&
              secrets.ROTH_IRA_AMOUNT || ''
            }}
        shell: bash
        run: |
          set -euo pipefail

          initialize_requested="${INITIALIZE_PORTFOLIO:-false}"
          configured_amount="$(
            printf '%s' "${ROTH_IRA_AMOUNT:-}" | tr -d '[:space:]'
          )"

          if [[ -f roth_ira_state.json ]]; then
            if [[ "${initialize_requested}" == "true" ]]; then
              echo "::error::initialize_portfolio cannot replace existing state."
              exit 1
            fi
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ||
                "${initialize_requested}" != "true" ]]; then
            echo "::error::No persisted state was restored; refusing implicit initialization."
            echo "::error::For a genuine first run, manually dispatch signal mode with initialize_portfolio=true."
            exit 1
          fi

          if [[ -z "${configured_amount}" ]]; then
            echo "::error::Explicit initialization requires ROTH_IRA_AMOUNT."
            echo "::error::Create the ROTH_IRA_AMOUNT repository secret for the first run."
            exit 1
          fi

      - name: Run ROTH IRA engine
        if: >-
          ${{
            (github.event_name == 'schedule' &&
             steps.market_session.outputs.is_session == 'true') ||
            (github.event_name == 'workflow_dispatch' &&
             inputs.validate_only == false)
          }}
        env:
          DISPATCH_RUN_MODE: ${{ inputs.run_mode }}
          EXECUTED_SIGNAL_DATE_INPUT: ${{ inputs.executed_signal_date }}
          EXECUTED_SHARES_INPUT: ${{ inputs.executed_shares }}
          GMAIL_ADDRESS: >-
            ${{
              (github.event_name == 'schedule' ||
               inputs.run_mode == 'signal') &&
              secrets.GMAIL_ADDRESS || ''
            }}
          GMAIL_APP_PASSWORD: >-
            ${{
              (github.event_name == 'schedule' ||
               inputs.run_mode == 'signal') &&
              secrets.GMAIL_APP_PASSWORD || ''
            }}
          RECEIVER_EMAIL: >-
            ${{
              (github.event_name == 'schedule' ||
               inputs.run_mode == 'signal') &&
              secrets.RECEIVER_EMAIL || ''
            }}
          ROTH_IRA_AMOUNT: >-
            ${{
              (github.event_name == 'workflow_dispatch' &&
               inputs.initialize_portfolio == true &&
               inputs.run_mode == 'signal') &&
              secrets.ROTH_IRA_AMOUNT || ''
            }}
        shell: bash
        run: |
          set -euo pipefail

          run_mode="signal"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            run_mode="${DISPATCH_RUN_MODE}"
          fi

          has_non_whitespace() {
            [[ "$1" =~ [^[:space:]] ]]
          }

          executed_signal_date="${EXECUTED_SIGNAL_DATE_INPUT}"
          normalized_shares="${EXECUTED_SHARES_INPUT//$'\r'/ }"
          normalized_shares="${normalized_shares//$'\n'/ }"
          executed_share_entries=()
          read -r -a executed_share_entries <<< "${normalized_shares}"

          engine_args=()
          case "${run_mode}" in
            signal)
              if has_non_whitespace "${executed_signal_date}" ||
                 has_non_whitespace "${EXECUTED_SHARES_INPUT}"; then
                echo "::error::Execution inputs are valid only for confirm-execution or sync-holdings."
                exit 1
              fi
              ;;
            confirm-execution)
              if ! has_non_whitespace "${executed_signal_date}"; then
                echo "::error::confirm-execution requires executed_signal_date."
                exit 1
              fi
              if (( ${#executed_share_entries[@]} == 0 )); then
                echo "::error::confirm-execution requires executed_shares."
                exit 1
              fi
              engine_args+=(
                --confirm-execution
                --executed-signal-date "${executed_signal_date}"
                --executed-shares
              )
              engine_args+=("${executed_share_entries[@]}")
              ;;
            sync-holdings)
              if has_non_whitespace "${executed_signal_date}"; then
                echo "::error::sync-holdings does not accept executed_signal_date."
                exit 1
              fi
              if (( ${#executed_share_entries[@]} == 0 )); then
                echo "::error::sync-holdings requires executed_shares."
                exit 1
              fi
              engine_args+=(--sync-holdings --executed-shares)
              engine_args+=("${executed_share_entries[@]}")
              ;;
            *)
              echo "::error::Unsupported run mode: ${run_mode}"
              exit 1
              ;;
          esac

          python port12_cloud.py "${engine_args[@]}"

      - name: Validation-only result
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only == true }}
        run: echo "Validation and unit tests completed; the trading engine was not run."

      # The state is stored as an artifact instead of being committed to the repository.
      # The next run restores the newest available state artifact.
      - name: Persist portfolio state
        if: >-
          ${{
            always() &&
            !(github.event_name == 'workflow_dispatch' &&
              inputs.validate_only == true) &&
            hashFiles('roth_ira_state.json') != ''
          }}
        uses: actions/upload-artifact@v4
        with:
          name: roth-ira-state
          path: roth_ira_state.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Upload run log
        if: ${{ always() && hashFiles('roth_ira.log') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: roth-ira-log-${{ github.run_id }}
          path: roth_ira.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload structured decision audit
        if: ${{ always() && hashFiles('roth_ira_decision.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: roth-ira-decision-${{ github.run_id }}
          path: roth_ira_decision.json
          if-no-files-found: ignore
          retention-days: 90
