name: Daily Portfolio 12 Execution

on:
  schedule:
    - cron: '15 21 * * 1-5'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Quant Engine
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python port12_cloud.py

  keepalive-job:
    name: Keep GitHub Actions Alive
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push a commit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        
      - name: Keepalive Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Write the current date to a hidden file to create a tiny change
          date +%s > .github/keepalive.txt
          
          # Commit and push
          git add .github/keepalive.txt
          git commit -m "chore: keep workflow alive" || echo "No changes to commit"
          git push
