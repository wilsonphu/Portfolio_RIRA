name: Daily Portfolio 12 Execution

on:
  schedule:
    - cron: '15 21 * * 1-5'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Quant Engine
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python port12_cloud.py

  keepalive-job:
    name: Keep GitHub Actions Alive
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keepalive Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the exact current workflow filename/ID dynamically
          gh workflow enable "${{ github.workflow }}" || gh workflow enable "main.yml"
